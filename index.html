<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>アニメリスト</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#050505">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title"
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="アニメリスト">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#050505; --accent:#e5344f; --line:rgba(255,255,255,.22);
  --watch:#4fa3ff; --done:#6fe28f; --plan:#ffb768;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:#000; color:#fff;
  font-family:"Zen Maru Gothic",-apple-system,sans-serif;
  height:100dvh; position:relative;
}
.swiper{
  height:100%; display:flex; overflow-x:auto; overflow-y:hidden; scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}
.card{
  flex:0 0 100%; scroll-snap-align:start; scroll-snap-stop:always; height:100%;
  position:relative; background:#141414 repeating-linear-gradient(135deg,#1b1b1b 0 12px,#111 12px 24px);
  background-size:cover; background-position:center; overflow:hidden;
}
.bgfile{display:none;}
.scrim-top{position:absolute; top:0; left:0; right:0; height:170px; background:linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,0)); pointer-events:none;}
.scrim-bottom{position:absolute; bottom:0; left:0; right:0; height:62%; background:linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.65) 45%, rgba(0,0,0,.96) 100%); pointer-events:none;}

.addimg-hint{
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center;
  color:rgba(255,255,255,.55); font-size:13px; border:1.5px dashed var(--line); border-radius:12px; padding:14px 18px;
}
.card.has-bg .addimg-hint{display:none;}

.iconbtn{
  width:34px; height:34px; border-radius:50%; border:1.5px solid var(--line); background:rgba(255,255,255,.1);
  color:#fff; font-size:14px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0;
  backdrop-filter:blur(6px);
}
.topbar{position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); left:12px; right:12px; z-index:3; display:flex; justify-content:space-between; align-items:center;}
.topbar-left{display:flex; gap:7px; align-items:center;}
.pill{
  font-size:11px; font-weight:900; padding:6px 13px; border-radius:999px; cursor:pointer;
  background:rgba(255,255,255,.12); border:1.5px solid var(--line); color:#fff; backdrop-filter:blur(6px);
}
.pill[data-s="watch"]{color:var(--watch);}
.pill[data-s="done"]{color:var(--done);}
.pill[data-s="plan"]{color:var(--plan);}

.content{position:absolute; left:0; right:0; bottom:0; z-index:3; padding:0 18px calc(env(safe-area-inset-bottom,0px) + 54px);}
.title{
  font-family:"Zen Kaku Gothic New","Zen Maru Gothic",sans-serif; font-weight:900; font-size:clamp(24px,7vw,36px);
  line-height:1.15; outline:none; text-shadow:0 2px 12px rgba(0,0,0,.5); min-height:1.2em;
}
.title:empty:before{content:"タイトル"; color:rgba(255,255,255,.4);}

.linkrow{margin-top:10px;}
.sitechip{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1.5px solid var(--line);
  border-radius:999px; padding:6px 13px; backdrop-filter:blur(6px);
}
.siteurl{font-size:12px; color:rgba(255,255,255,.85); outline:none; max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.siteurl:empty:before{content:"公式サイトURL"; color:rgba(255,255,255,.4);}
.siteurl:focus{white-space:normal; max-width:none;}
.openlink{background:none; border:none; color:var(--accent); font-size:12px; font-weight:900; cursor:pointer; padding:0;}

.detail{
  margin-top:12px; font-size:13px; color:rgba(255,255,255,.72); line-height:1.6; outline:none;
  max-height:4.9em; overflow:hidden;
}
.detail:empty:before{content:"詳細を入力"; color:rgba(255,255,255,.35);}
.detail.expanded{max-height:none;}
.expandBtn{background:none; border:none; color:#fff; font-weight:900; font-size:11.5px; cursor:pointer; padding:6px 0 0; opacity:.75;}

header{
  position:fixed; top:0; left:0; right:0; z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 8px;
  background:linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0));
  display:flex; flex-direction:column; gap:8px; pointer-events:none;
}
header > *{pointer-events:auto;}
.headrow{display:flex; justify-content:flex-start; align-items:center; gap:8px;}
.addBtn{
  background:var(--accent); color:#fff; border:none; border-radius:999px;
  font-family:"Zen Maru Gothic",sans-serif; font-weight:900; font-size:13px; padding:8px 16px; cursor:pointer;
}
.addBtn:active{transform:scale(.96);}

.nav{
  position:absolute; top:50%; transform:translateY(-50%); z-index:4; width:38px; height:38px;
  border-radius:50%; border:1.5px solid var(--line); background:rgba(0,0,0,.35); color:#fff;
  font-size:16px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; backdrop-filter:blur(6px);
}
.nav.prev{left:6px;} .nav.next{right:6px;}
.counter{
  position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); left:50%; transform:translateX(-50%);
  z-index:4; background:rgba(0,0,0,.4); border:1.5px solid var(--line); border-radius:999px;
  padding:4px 12px; font-size:11px; font-weight:700; color:rgba(255,255,255,.8); backdrop-filter:blur(6px);
}
.ui-chrome{transition:opacity .35s ease;}
body.hide-ui .ui-chrome{opacity:0; pointer-events:none;}
.empty-state{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:30px;
}
.empty-state div{color:rgba(255,255,255,.55); text-align:center; font-size:13.5px; border:1.5px dashed var(--line); border-radius:16px; padding:26px; max-width:260px;}
</style>
</head>
<body>
  <header class="ui-chrome">
    <div class="headrow">
      <button class="addBtn" id="addBtn">＋ 追加</button>
    </div>
  </header>

  <div class="swiper" id="swiper"></div>
  <button class="nav prev ui-chrome" id="prevBtn">‹</button>
  <button class="nav next ui-chrome" id="nextBtn">›</button>
  <div class="counter ui-chrome" id="counter"></div>

<script>
const KEY='animeListEntries_v5';
let entries = JSON.parse(localStorage.getItem(KEY) || '[]');
const statusCycle = {plan:'watch', watch:'done', done:'plan'};
const statusLabel = {watch:'視聴中', done:'完了', plan:'予定'};
const swiper = document.getElementById('swiper');

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(entries)); }catch(e){} }

function addEntry(){
  entries.unshift({ id: Date.now()+Math.random().toString(16).slice(2), title:'', url:'', detail:'', bg:null, status:'plan' });
  save(); render();
  swiper.scrollTo({left:0, behavior:'instant'});
  const first = swiper.querySelector('.card .title');
  if(first) first.focus();
}

function render(){
  const list = entries;
  if(!list.length){
    swiper.innerHTML = `<div class="card" style="flex-basis:100%"><div class="empty-state"><div>まだ作品が登録されていません。右上の「＋ 追加」から作ってみましょう。</div></div></div>`;
    document.getElementById('counter').textContent='';
    return;
  }
  swiper.innerHTML = list.map(e => `
    <div class="card ${e.bg?'has-bg':''}" data-id="${e.id}" data-act="imgzone" style="${e.bg?`background-image:url(${e.bg})`:''}">
      <div class="scrim-top"></div>
      <div class="scrim-bottom"></div>
      <div class="addimg-hint">タップして<br>背景画像を追加</div>
      <input type="file" accept="image/*" class="bgfile" data-act="file">
      <div class="topbar">
        <div class="topbar-left">
          <span class="pill ui-chrome" data-s="${e.status}" data-act="status">${statusLabel[e.status]}</span>
        </div>
        <button class="iconbtn ui-chrome" data-act="del" title="削除">✕</button>
      </div>
      <div class="content" data-act="content">
        <div class="title" contenteditable data-act="title">${e.title}</div>
        <div class="linkrow"><span class="sitechip">
          <span class="siteurl" contenteditable data-act="url">${e.url}</span>
          ${e.url ? `<button class="openlink" data-act="open">開く ↗</button>` : ''}
        </span></div>
        <div class="detail" contenteditable data-act="detail">${e.detail}</div>
        ${e.detail && e.detail.length>70 ? `<button class="expandBtn" data-act="expand">もっと見る</button>` : ''}
      </div>
    </div>`).join('');
  updateCounter();
}

function updateCounter(){
  const total = swiper.children.length;
  if(!total || swiper.children[0].querySelector('.empty-state')){ document.getElementById('counter').textContent=''; return; }
  const idx = Math.round(swiper.scrollLeft / swiper.clientWidth) + 1;
  document.getElementById('counter').textContent = `${Math.min(idx,total)} / ${total}`;
}

document.getElementById('addBtn').onclick = addEntry;
document.getElementById('prevBtn').onclick = ()=> swiper.scrollBy({left:-swiper.clientWidth, behavior:'smooth'});
document.getElementById('nextBtn').onclick = ()=> swiper.scrollBy({left:swiper.clientWidth, behavior:'smooth'});
swiper.addEventListener('scroll', ()=> requestAnimationFrame(updateCounter));

swiper.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(!card) return;
  const id = card.dataset.id;
  const entry = entries.find(x=>x.id===id);
  const actEl = e.target.closest('[data-act]');
  const act = actEl ? actEl.dataset.act : null;
  if(act==='del'){ entries = entries.filter(x=>x.id!==id); save(); render(); }
  else if(act==='status'){ entry.status = statusCycle[entry.status]; save(); render(); }
  else if(act==='imgzone'){ card.querySelector('.bgfile').click(); }
  else if(act==='open'){ let u = entry.url.trim(); if(u) window.open(/^https?:\/\//i.test(u)?u:'https://'+u,'_blank'); }
  else if(act==='expand'){ const d = card.querySelector('.detail'); d.classList.toggle('expanded'); actEl.textContent = d.classList.contains('expanded') ? '閉じる' : 'もっと見る'; }
});

swiper.addEventListener('change', e=>{
  if(e.target.dataset.act==='file'){
    const card = e.target.closest('.card');
    const entry = entries.find(x=>x.id===card.dataset.id);
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ entry.bg = reader.result; save(); render(); };
    reader.readAsDataURL(file);
  }
});

swiper.addEventListener('blur', e=>{
  const act = e.target.dataset.act;
  if(!act) return;
  const card = e.target.closest('.card');
  const entry = entries.find(x=>x.id===card.dataset.id);
  if(act==='title') entry.title = e.target.textContent.trim();
  else if(act==='url') entry.url = e.target.textContent.trim();
  else if(act==='detail') entry.detail = e.target.textContent.trim();
  else return;
  save();
  if(act==='url') render();
}, true);

render();

// --- auto-hide chrome ---
let hideTimer;
function showUI(){
  document.body.classList.remove('hide-ui');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(()=> document.body.classList.add('hide-ui'), 3000);
}
['touchstart','mousedown','scroll','keydown'].forEach(ev=> document.addEventListener(ev, showUI, {passive:true}));
document.addEventListener('focusin', e=>{ if(e.target.isContentEditable){ clearTimeout(hideTimer); document.body.classList.remove('hide-ui'); } });
document.addEventListener('focusout', e=>{ if(e.target.isContentEditable){ showUI(); } });
showUI();

// --- fullscreen ---
let fsTried = false;
function tryFullscreen(){
  if(fsTried || document.fullscreenElement) return;
  fsTried = true;
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if(req){ try{ req.call(el).catch(()=>{}); }catch(err){} }
}
document.addEventListener('click', tryFullscreen, {once:true});
document.addEventListener('touchend', tryFullscreen, {once:true});

// --- PWA service worker ---
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
